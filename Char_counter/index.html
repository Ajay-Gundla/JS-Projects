<!DOCTYPE html>
<html>
    <head>
        <title>Character counter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Real time Character Counter</h1>
            <textarea id="text-area" class="textarea" placeholder="Please enter the text....." maxlength="40"></textarea>
            <div id="count-container">
                <p>Count: <span id="count"></span></p>
                <p>Remaining: <span id="remaining"></span></p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
